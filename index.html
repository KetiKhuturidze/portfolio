<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ketevan Khuturidze — Game Developer</title>
  <meta name="description" content="Ketevan Khuturidze — Game Developer specializing in Unity, C#, and JavaScript/TypeScript — crafting high-performance games with Pixi.js, HTML5, and modern web tech." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0c10;         /* page background */
      --panel:#0f1117;      /* subtle section bg */
      --card:#11131a;       /* card bg */
      --ink:#e7e9ef;        /* primary text */
      --muted:#a6adbb;      /* secondary text */
      --line:rgba(255,255,255,.08);
      --accent:#8aa2ff;     /* links & accents */
      --maxW:1200px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* ====== LAYOUT ====== */
    .app{min-height:100dvh;display:grid;grid-template-columns:260px 1fr}
    .sidebar{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh}

    .brand{display:flex;align-items:center;gap:14px}
    .avatar{width:56px;height:56px;border-radius:50%;background:#1b1e27;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .brand h1{font-size:16px;margin:0;line-height:1.2}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}

    .contact-mini{display:grid;gap:10px;margin-top:6px}
    .contact-mini a{display:flex;gap:8px;align-items:center;color:var(--ink);text-decoration:none;padding:8px 10px;border:1px solid transparent;border-radius:10px}
    .contact-mini a:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
    .contact-mini svg{width:16px;height:16px;opacity:.9}

    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:12px;background:var(--accent);color:#0b0c10;font-weight:700;border:1px solid transparent}
    .btn:hover{filter:brightness(1.05)}

    /* === FIX Download CV overflow === */
    .contact-mini a.btn {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 12px 0 !important;
      margin-top: 6px;
    }

    .nav{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;border:1px solid transparent}
    .nav a:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
    .nav svg{width:18px;height:18px;opacity:.9}

    .main{padding:28px;max-width:var(--maxW);width:100%;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}

    /* ====== HERO ====== */
    .hero{margin-bottom:22px}
    .hero h2{font-size:clamp(26px,3.6vw,42px);margin:0 0 10px}
    .hero p{margin:0;color:var(--muted);max-width:70ch}

    /* ====== PROJECTS GALLERY ====== */
    .gallery-wrap{position:relative;margin:22px 0 10px}
    .gallery{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
    .gallery::-webkit-scrollbar{display:none}
    .card{min-width:320px;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
    .card img{width:100%;height:200px;object-fit:cover;background:#0e1116}
    .card-body{padding:14px}
    .card-title{font-weight:700;margin:0 0 6px}
    .card-meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}
    .card-links{display:flex;gap:10px;margin-top:8px}
    .hover-hint{position:absolute;right:6px;top:-18px;font-size:12px;color:var(--muted)}

    section{margin-top:28px}
    .section-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
    .section-card h3{margin:0 0 10px}
    .stack{display:flex;flex-direction:column;gap:10px}
    .grid{display:grid;gap:16px}
    @media(min-width:860px){.grid.two{grid-template-columns:1fr 1fr}}

    /* reveal on scroll */
    .reveal{opacity:0;transform:translateY(12px);transition:opacity .5s ease, transform .5s ease}
    .reveal.show{opacity:1;transform:none}

    /* responsive sidebar collapse */
    @media (max-width: 1020px){
      .app{grid-template-columns:84px 1fr}
      .brand h1,.sub{display:none}
      .avatar{width:44px;height:44px}
      .contact-mini{display:none}
      .nav a span{display:none}
      .nav a{justify-content:center}
      .main{padding:20px}
    }
  </style>
</head>
